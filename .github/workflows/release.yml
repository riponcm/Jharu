name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Jharu ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  update-readme:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point README download links at the new release
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          sed -i -E \
            -e "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/Jharu_[0-9]+\.[0-9]+\.[0-9]+_universal\.dmg#releases/download/${TAG}/Jharu_${VERSION}_universal.dmg#g" \
            -e "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/Jharu_[0-9]+\.[0-9]+\.[0-9]+_x64-setup\.exe#releases/download/${TAG}/Jharu_${VERSION}_x64-setup.exe#g" \
            -e "s#Current version: \*\*v[0-9]+\.[0-9]+\.[0-9]+\*\*#Current version: **${TAG}**#g" \
            README.md

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README download links to ${GITHUB_REF_NAME}"
          git push origin HEAD:main
