name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # Signed with Azure Artifact Signing (account matily-signing,
          # profile matily-public); local builds stay unsigned.
          - platform: windows-latest
            args: "--config src-tauri/release-signing.json"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Install the Windows signing tool
        if: matrix.platform == 'windows-latest'
        run: cargo install trusted-signing-cli --locked

      # Signs and notarizes the Mac build with the Developer ID certificate.
      # The values are passed on only when the secrets exist: an empty
      # APPLE_CERTIFICATE would make the bundler fail instead of skipping.
      - name: Apple signing and notarization
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple signing secrets; the Mac build will be unsigned."
            exit 0
          fi
          # A pasted certificate may carry line breaks; base64 must not.
          cert=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d ' \r\n')
          # No longer the stored secret, so GitHub would not hide it in logs.
          echo "::add-mask::$cert"
          echo "APPLE_CERTIFICATE=$cert" >> "$GITHUB_ENV"
          for v in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s=%s\n' "$v" "$(printf '%s' "${!v}" | tr -d '\r\n')" >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # The app registration matily-release-signing, which may sign
          # with the matily-public certificate profile.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Jharu ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  update-readme:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point README download links at the new release
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          sed -i -E \
            -e "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/Jharu_[0-9]+\.[0-9]+\.[0-9]+_universal\.dmg#releases/download/${TAG}/Jharu_${VERSION}_universal.dmg#g" \
            -e "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/Jharu_[0-9]+\.[0-9]+\.[0-9]+_x64-setup\.exe#releases/download/${TAG}/Jharu_${VERSION}_x64-setup.exe#g" \
            -e "s#Current version: \*\*v[0-9]+\.[0-9]+\.[0-9]+\*\*#Current version: **${TAG}**#g" \
            README.md

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README download links to ${GITHUB_REF_NAME}"
          git push origin HEAD:main
